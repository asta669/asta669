name: Build Wake Up! APK

on:
  push:
    paths:
      - 'wake-up-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'wake-up-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build debug APK
        working-directory: wake-up-android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation
          path: wake-up-android/app/build/reports/
          if-no-files-found: ignore

      - name: Rename APK
        run: cp wake-up-android/app/build/outputs/apk/debug/app-debug.apk WakeUp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakeUp-debug-apk
          path: WakeUp.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: WakeUp-debug-apk

      - name: Publish APK to a downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Wake Up! — latest app
          body: |
            Direct download of the Wake Up! Android app.
            Tap **WakeUp.apk** below on your phone to install it.
          files: WakeUp.apk
